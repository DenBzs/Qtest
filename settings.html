<div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>🪄전개지시M</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
        <div class="flex-container flexnowrap">
            <label class="checkbox_label" for="direction_manager_enabled">
                <input type="checkbox" id="direction_manager_enabled" class="checkbox">
                <span>🪄전개지시M 활성화</span>
            </label>
        </div>
        <br>

        <h4>전개지시 (전역 / 캐릭터 / 실행)</h4>
        <div class="">
            <div><label for="direction_prompt_text" class="flex1">Direction 프롬프트 (공통 템플릿, {{direction}} 자리에 각 범위 내용이 들어감)</label></div>
            <textarea id="direction_prompt_text" class="text_pole textarea_compact" rows="7" placeholder="Direction 프롬프트를 입력하세요..."></textarea>
        </div>
        <div class="flex-container flexnowrap">
            <label for="direction_depth_global" class="flex1">전역 삽입 위치 (Depth)</label>
            <input id="direction_depth_global" class="text_pole widthUnset" type="number" min="0" max="100" value="0" title="0: Chat History 끝에 삽입, >0: 끝에서부터 N번째 위치에 삽입">
        </div>
        <div class="flex-container flexnowrap">
            <label for="direction_depth_char" class="flex1">캐릭터 삽입 위치 (Depth)</label>
            <input id="direction_depth_char" class="text_pole widthUnset" type="number" min="0" max="100" value="1">
        </div>
        <div class="flex-container flexnowrap">
            <label for="direction_depth_chat" class="flex1">실행 삽입 위치 (Depth)</label>
            <input id="direction_depth_chat" class="text_pole widthUnset" type="number" min="0" max="100" value="1">
        </div>
        <br>

        <h4>예언 (다음 전개 후보 / 줄거리)</h4>
        <div class="">
            <div><label for="foresight_slots_prompt_text" class="flex1">예언 장면 후보 프롬프트 ({{slot1}}, {{slot2}})</label></div>
            <textarea id="foresight_slots_prompt_text" class="text_pole textarea_compact" rows="6" placeholder="예언 장면 후보 프롬프트를 입력하세요..."></textarea>
        </div>
        <div class="flex-container flexnowrap">
            <label for="foresight_depth_slots" class="flex1">장면 후보 삽입 위치 (Depth)</label>
            <input id="foresight_depth_slots" class="text_pole widthUnset" type="number" min="0" max="100" value="1">
        </div>
        <div class="">
            <div><label for="foresight_story_prompt_text" class="flex1">예언 스토리 프롬프트 ({{story}})</label></div>
            <textarea id="foresight_story_prompt_text" class="text_pole textarea_compact" rows="5" placeholder="예언 스토리 프롬프트를 입력하세요..."></textarea>
        </div>
        <div class="flex-container flexnowrap">
            <label for="foresight_depth_story" class="flex1">스토리 삽입 위치 (Depth)</label>
            <input id="foresight_depth_story" class="text_pole widthUnset" type="number" min="0" max="100" value="3" title="장면 후보보다 큰 값을 주면 대화 끝에서 더 먼 위치에 들어가 존재감이 낮아집니다">
        </div>
        <br>

        <div class="flex-container flexnowrap">
            <label for="direction_default_scope" class="flex1">팝업 기본 범위</label>
            <select id="direction_default_scope" class="text_pole widthUnset">
                <option value="global">전역</option>
                <option value="char">캐릭터</option>
                <option value="foresight">예언</option>
                <option value="chat" selected>실행</option>
            </select>
        </div>
        <div class="flex-container flexnowrap">
            <button id="direction_reset_prompt" class="menu_button" title="기본 프롬프트/Depth로 초기화">
                <i class="fa-solid fa-refresh"></i>
                <span>기본값으로 초기화</span>
            </button>
            <button id="direction_clear_char" class="menu_button" title="현재 채팅방의 캐릭터 범위 저장 내용 삭제">
                <i class="fa-solid fa-user-slash"></i>
                <span>이 캐릭터 데이터 삭제</span>
            </button>
            <button id="direction_clear_chat" class="menu_button" title="현재 채팅방의 실행 범위 저장 내용 삭제">
                <i class="fa-solid fa-comment-slash"></i>
                <span>이 채팅 데이터 삭제</span>
            </button>
            <button id="direction_clear_foresight" class="menu_button" title="현재 채팅방의 예언(1/2/스토리) 저장 내용 삭제">
                <i class="fa-solid fa-hat-wizard"></i>
                <span>이 예언 데이터 삭제</span>
            </button>
        </div>
    </div>
</div>
